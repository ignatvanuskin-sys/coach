<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Айгерим Серикова</title>
<meta name="description" content="Такой страницы нет. Вернитесь на главную и запишитесь на бесплатный разбор 30 минут.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF6F0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/styles.css">
<style>
  .err{
    min-height:100vh;
    display:grid;
    place-items:center;
    text-align:center;
    padding:clamp(40px,8vw,90px) 0;
  }
  .err-inner{max-width:32em;margin:0 auto}
  .err-code{
    font-family:var(--ff-display);
    font-size:clamp(4.5rem,14vw,9rem);
    line-height:.9;
    color:var(--terra-ink);
    margin:0 0 .1em;
  }
  .err h1{font-size:clamp(1.9rem,4vw,2.8rem)}
  .err p{color:var(--muted);font-size:1.08rem;line-height:1.6}
  .err-actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:30px}
  .err-links{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;margin-top:38px;padding-top:26px;border-top:1px solid var(--line)}
  .err-links a{font-size:.98rem;color:var(--ink-soft);padding:8px 0;border-bottom:1px solid transparent;transition:border-color .2s ease,color .2s ease}
  .err-links a:hover{color:var(--wine);border-bottom-color:var(--gold)}
</style>
</head>
<body>
<main class="err">
  <div class="wrap err-inner">
    <p class="eyebrow">Страница не найдена</p>
    <p class="err-code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Зато всё остальное на месте — вернись на главную и посмотри, с чем я работаю.</p>

    <div class="err-actions">
      <a class="btn btn-primary" href="/">На главную</a>
      <a class="btn btn-ghost" href="/#book">Записаться на разбор</a>
    </div>

    <nav class="err-links" aria-label="Основные разделы">
      <a href="/#for-whom">Для кого</a>
      <a href="/#how">Как работаем</a>
      <a href="/#results">Результаты</a>
      <a href="/#about">Обо мне</a>
      <a href="/#pricing">Форматы и цены</a>
      <a href="/#faq">Вопросы</a>
    </nav>
  </div>
</main>
</body>
</html>
